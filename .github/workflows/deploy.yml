name: Auto Build Staging / Production Docker Image
on:
  push:
    branches: [staging, main]
jobs:
  build-env-image:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[azure]"

      - name: Pull dataset from Azure (DVC)
        env:
          AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
        run: |
          dvc remote modify --local myazure url azure://dvc/smart-waste-classifier/
          dvc remote modify --local myazure account_name "$AZURE_ACCOUNT_NAME"
          dvc remote modify --local myazure sas_token "$AZURE_SAS_TOKEN"
          dvc pull

      - name: Train model (generate artifact for docker image)
        run: python ml/train.py

      - name: Generate .env file from secrets
        run: |
          cat > .env << EOF
          APP_ENV=${{ github.ref_name }}
          API_KEY=${{ secrets.APP_ENV_API_KEY }}
          EOF

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image (staging/prod build only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: waste-app:${{ github.ref_name }}
          push: false
