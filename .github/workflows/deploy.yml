name: Auto Build Staging / Production Docker Image
on:
  push:
    branches: [ staging, main ]
jobs:
  build-env-image:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate .env file from secrets (staging/prod)
        run: |
          cat > .env << EOF
          APP_ENV=${{ github.ref_name }}
          API_KEY=${{ secrets.APP_ENV_API_KEY }}
          EOF

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image (staging/prod build only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: waste-app:${{ github.ref_name }}
          push: false
